<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lobby Leaderboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Make the widget fill the entire screen */
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;

    /* Force the injected iframe to take full size */
    body > iframe,
    body > div {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      border: none !important;
    }
  </style>
